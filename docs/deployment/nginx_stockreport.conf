# Stock Report - stockreport.khoviet.com
# Port 8002 (tránh conflict: 8000=ecodata, 8001=stock-api)
# Deploy: /etc/nginx/sites-available/stockreport.khoviet.com

server {
    listen 80;
    listen [::]:80;
    server_name stockreport.khoviet.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stockreport.khoviet.com;

    # SSL - Let's Encrypt (certbot)
    ssl_certificate /etc/letsencrypt/live/stockreport.khoviet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockreport.khoviet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # WebSocket - cần location riêng với timeout dài
    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Key $http_sec_web_socket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_web_socket_version;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 7s;
    }

    # Proxy to Stock Report (FastAPI + static)
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
